name: Personal OS CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile server.py personal_os.py

      - name: Check JS syntax
        run: node --check static/app.js

      - name: Check HTML well-formed
        run: python3 -c "from html.parser import HTMLParser; HTMLParser().feed(open('index.html').read())"

      - name: Check CSS syntax
        run: python3 -c "import re; css=open('static/styles.css').read(); print('CSS lines:', len(css.splitlines()))"

      - name: Test server starts
        run: |
          timeout 5 python3 server.py --host 127.0.0.1 --port 8766 &
          sleep 2
          curl -fsS http://127.0.0.1:8766/api/health && echo "SERVER_OK"
          lsof -ti:8766 | xargs kill 2>/dev/null || true
