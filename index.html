<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AgenticOS · Mohammad</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/planning.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#">
      <img class="brand-logo" src="/static/logo.svg" alt="AgenticOS" width="32" height="32">
      <div class="brand-text"><strong>AgenticOS</strong><small>Mohammad's command center</small></div>
    </a>
    <nav id="nav" aria-label="Personal OS navigation"></nav>
    <div class="sidebar-footer"><span class="status-dot"></span><span id="runtime-status">Checking local core…</span></div>
  </aside>
  <section class="workspace">
    <header class="topbar">
      <button class="icon-button mobile-only" id="menu-button" aria-label="Open navigation">☰</button>
      <div><span class="crumb">AgenticOS / </span><strong id="page-title">Overview</strong></div>
      <div class="topbar-right">
        <button class="command" id="command-button">Search pages <kbd>⌘K</kbd></button>
        <div class="avatar">MJ</div>
      </div>
    </header>
    <main id="content" tabindex="-1"></main>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<!-- Page Agent: floating AI page-control widget -->
<div id="page-agent" class="page-agent-wrap" style="display:none">
  <div class="page-agent-header" id="page-agent-header">
    <span>🤖 Page Agent</span>
    <div class="page-agent-controls">
      <button id="page-agent-pin" title="Pin open">📌</button>
      <button id="page-agent-close" title="Collapse">✕</button>
    </div>
  </div>
  <div class="page-agent-messages" id="page-agent-messages"></div>
  <div class="page-agent-input-row">
    <input id="page-agent-input" placeholder="Change this, add that…" autocomplete="off">
    <button id="page-agent-send">⏎</button>
  </div>
  <div class="page-agent-warn">⚠️ AI edits this page. Review each change.</div>
</div>
<button id="page-agent-toggle" class="page-agent-toggle-btn" title="Page Agent — control this page with AI">🤖</button>

<dialog id="modal"><form method="dialog" class="modal-card"><div class="modal-head"><div><p class="eyebrow" id="modal-kicker">CREATE</p><h2 id="modal-title">Add item</h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></div><div id="modal-body"></div></form></dialog>
<dialog id="command"><div class="command-card"><div class="command-input-wrap"><input id="command-input" placeholder="Go to agents, files, connectors…" autocomplete="off"><button class="command-clear" id="command-clear" style="display:none">✕</button></div><div id="command-results"></div></div></dialog>

<script src="/static/app.js"></script>
<script src="/static/planning.js"></script>
<script src="/static/create-agent.js"></script>
</body>
</html>
