<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" width="120" height="32" role="img" aria-label="AgenticOS logo">
  <defs>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5856d6"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
  </defs>
  <!-- Hexagon icon -->
  <g transform="translate(0,1)">
    <path d="M16 2 L28 9 L28 23 L16 30 L4 23 L4 9 Z" fill="url(#ag)" opacity="0.9"/>
    <!-- Neural node pattern inside hexagon -->
    <circle cx="16" cy="11" r="2.5" fill="white" opacity="0.95"/>
    <circle cx="10" cy="18" r="2" fill="white" opacity="0.7"/>
    <circle cx="22" cy="18" r="2" fill="white" opacity="0.7"/>
    <circle cx="16" cy="23" r="1.8" fill="white" opacity="0.6"/>
    <!-- Connection lines -->
    <line x1="16" y1="11" x2="10" y2="18" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="16" y1="11" x2="22" y2="18" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="18" x2="16" y2="23" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="22" y1="18" x2="16" y2="23" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="16" y1="11" x2="16" y2="23" stroke="white" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Text -->
  <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="-0.4">AgenticOS</text>
</svg>
